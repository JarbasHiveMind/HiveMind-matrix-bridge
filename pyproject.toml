[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-matrix-bridge"
dynamic = ["version"]
description = "matrix bridge for hivemind"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "hivemind_bus_client>=0.4.2,<1.0.0",
    "click",
    "python-matrixbot>=0.0.7",
    "ovos-solver-hivemind-plugin",
]

[project.scripts]
HiveMind-matrix = "hm_matrix_bridge.__main__:main"

[tool.setuptools]
packages = ["hm_matrix_bridge"]

[tool.setuptools.dynamic]
version = {attr = "hm_matrix_bridge.version.__version__"}
