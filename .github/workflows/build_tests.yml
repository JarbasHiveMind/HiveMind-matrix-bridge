name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      install_extras: 'test'
      # network-free smoke tests only; the real-hub e2e suite (tests/e2e) runs
      # in its own workflow (e2e_tests.yml) where hivescope is installed.
      test_path: 'tests/test_smoke.py'
